<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>I love you</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: black;
    }
    canvas {
      display: block;
      background: black;
    }
  </style>
</head>
<body>
<canvas id="canvas"></canvas>

<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}

resize();
window.addEventListener("resize", resize);

ctx.fillStyle = "black";
ctx.fillRect(0, 0, canvas.width, canvas.height);

ctx.fillStyle = "#ffb6c1";
ctx.textAlign = "center";
ctx.font = "bold 8px Arial";

let scale = 11;
let i = 0;

function frame() {
  if (scale > 16) return;

  const angle = i * (Math.PI * 2) / 120;

  const x = 16 * (Math.sin(angle) ** 3) * scale;

  const y = (
    13 * Math.cos(angle)
    - 5 * Math.cos(2 * angle)
    - 2 * Math.cos(3 * angle)
    - Math.cos(4 * angle)
  ) * scale;

  // فقط اصلاح محور Y برای هماهنگی با مختصات Turtle
  const screenX = canvas.width / 2 + x;
  const screenY = canvas.height / 2 - y;

  ctx.fillText("I love you", screenX, screenY);

  i++;

  if (i >= 120) {
    i = 0;
    scale++;
  }

  setTimeout(frame, 50);
}

frame();
</script>
</body>
</html>
