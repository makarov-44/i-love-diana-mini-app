<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>I love you</title>
  <style>
    html,body { margin:0; width:100%; height:100%; overflow:hidden; background:#000; }
    canvas { display:block; width:100vw; height:100vh; background:#000; }
  </style>
</head>
<body>
<canvas id="screen"></canvas>
<script>
const canvas = document.getElementById("screen");
const ctx = canvas.getContext("2d");

function resize() {
  const dpr = window.devicePixelRatio || 1;
  canvas.width = Math.round(innerWidth * dpr);
  canvas.height = Math.round(innerHeight * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, innerWidth / 2, innerHeight / 2);
  ctx.fillStyle = "black";
  ctx.fillRect(-innerWidth / 2, -innerHeight / 2, innerWidth, innerHeight);
}
resize();
addEventListener("resize", resize);

// Same values/formulas as the original Python file.
const scales = [];
for (let scale = 11; scale < 17; scale++) scales.push(scale);

let scaleIndex = 0;
let i = 0;

ctx.fillStyle = "#ffb6c1";
ctx.textAlign = "center";
ctx.font = 'bold 8px Arial';

// The original turtle code repeatedly goes to the calculated point
// and writes "I love you". We reproduce those operations in order.
function frame() {
  if (scaleIndex >= scales.length) return;

  const scale = scales[scaleIndex];
  const angle = i * (Math.PI * 2) / 120;

  const x = 16 * (Math.sin(angle) ** 3) * scale;
  const y = (
    13 * Math.cos(angle)
    - 5 * Math.cos(2 * angle)
    - 2 * Math.cos(3 * angle)
    - Math.cos(4 * angle)
  ) * scale;

  ctx.fillText("I love you", x, y);

  i++;
  if (i >= 120) {
    i = 0;
    scaleIndex++;
  }

  // Browser rendering cannot use turtle's desktop animation engine.
  // Keep the original speed setting represented as the animation pace.
  setTimeout(frame, 50);
}
frame();
</script>
</body>
</html>
